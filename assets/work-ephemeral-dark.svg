rm:scaleX(0)}14%{transform:scaleX(0)}17%{transform:scaleX(1)}21%{transform:scaleX(1)}60%{transform:scaleX(0)}100%{transform:scaleX(0)}}@keyframes dn{0%{opacity:0}61%{opacity:0}65%{opacity:1}90%{opacity:1}96%{opacity:0}100%{opacity:0}}</style><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#13110f"/><stop offset="1" stop-color="#0b0a09"/></linearGradient><linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#D97757"/><stop offset="1" stop-color="#D97757" stop-opacity="0"/></linearGradient><pattern id="g" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="1.1" fill="#211d1a"/></pattern></defs><rect x="8" y="8" width="864" height="236" rx="18" fill="url(#bg)" stroke="#2a241f" stroke-width="1.5"/><rect x="9" y="9" width="862" height="234" rx="17" fill="url(#g)"/><rect x="26" y="8.75" width="828" height="2.5" rx="1.25" fill="url(#glow)"/><text x="40.0" y="46.0" font-size="15" fill="#958779" class="cap">merge request</text><text x="232.0" y="46.0" font-size="15" fill="#958779" class="cap">ephemeral environment</text><text x="626.0" y="46.0" font-size="15" fill="#958779" class="cap">TTL</text><text x="738.0" y="46.0" font-size="15" fill="#958779" class="cap">cleanup</text><g style="animation:ln 9.0s linear -1.20s infinite both"><rect x="36.0" y="65.0" width="150.0" height="38.0" rx="9" fill="#181411" stroke="#332b25" stroke-width="1.5"/><text x="52.0" y="91.0" font-size="18" fill="#ddd4ca" font-weight="700" class="mb" style="--m:24px">feat/ui</text><path d="M194.0 84.0 H221.0" stroke="#4a3f37" stroke-width="1.6" stroke-linecap="round"/><path d="M217.5 79.5 L222.0 84.0 L217.5 88.5" fill="none" stroke="#4a3f37" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="190" cy="84" r="4" fill="#D97757" opacity="0" style="animation:ar 9.0s linear -1.20s infinite both"/><g style="animation:env 9.0s linear -1.20s infinite both"><rect x="232" y="63" width="380" he